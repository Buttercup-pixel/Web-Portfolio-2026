<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>johanna nordlander</title>
<meta name="description" content="Johanna Nordlander — makeup artist &amp; art director">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <span class="name">johanna nordlander</span>
  </div>
  <nav class="header-nav">
    <span>makeup artist</span>
    <span>art director</span>
  </nav>
  <span class="header-about">about</span>
  <a class="header-email" href="mailto:johannanordlandermua@gmail.com">johannanordlandermua@gmail.com</a>
</header>

<main class="gallery">
  <div class="col col-left" id="colLeft">
    <figure class="tile" style="aspect-ratio: 4 / 5;">
      <img src="assets/images/img-01-floral.jpeg" alt="High fashion editorial portrait" loading="lazy">
      <figcaption><span class="cap-label">make up</span><span class="cap-arrow">&darr;</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 7 / 8;">
      <img src="assets/images/img-03-avantgarde.jpg" alt="Avant garde fashion pose" loading="lazy">
      <figcaption><span class="cap-label">make up</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 4 / 5;">
      <img src="assets/images/img-05-blue.jpg" alt="Blue couture editorial portrait" loading="lazy">
      <figcaption><span class="cap-label">make up</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 2 / 3;">
      <img src="assets/images/img-06-reddress.jpg" alt="Red dress fashion editorial" loading="lazy">
      <figcaption><span class="cap-label">make up</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 4 / 5;">
      <img src="assets/images/img-08-gloves.jpg" alt="Black gloves luxury editorial" loading="lazy">
      <figcaption><span class="cap-label">make up</span></figcaption>
    </figure>
  </div>

  <div class="col col-right" id="colRight">
    <figure class="tile" style="aspect-ratio: 4 / 5;">
      <img src="assets/images/img-02-redskirt.jpg" alt="High fashion red skirt editorial" loading="lazy">
      <figcaption><span class="cap-label">digital</span><span class="cap-arrow">&darr;</span></figcaption>
    </figure>

    <figure class="tile tile-logo" style="aspect-ratio: 1 / 1;">
      <div class="logo-box">
        <img src="assets/images/logo-acte.svg" alt="Acté Atelier logo">
      </div>
      <figcaption><span class="cap-label">digital</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 4 / 5;">
      <img src="assets/images/img-04-redlit.webp" alt="Red-lit fashion editorial" loading="lazy">
      <figcaption><span class="cap-label">digital</span></figcaption>
    </figure>

    <figure class="tile tile-logo" style="aspect-ratio: 1 / 1;">
      <div class="logo-box logo-box--mamika">
        <img src="assets/images/logo-mamika.svg" alt="Mamika Suzuki logo">
      </div>
      <figcaption><span class="cap-label">digital</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 3 / 4;">
      <img src="assets/images/img-07-whitedress.jpg" alt="White dress high fashion editorial" loading="lazy">
      <figcaption><span class="cap-label">digital</span></figcaption>
    </figure>

    <figure class="tile" style="aspect-ratio: 4 / 3;">
      <img src="assets/images/img-10-dramatic.jpg" alt="Dramatic dark fashion portrait" loading="lazy">
      <figcaption><span class="cap-label">digital</span></figcaption>
    </figure>
  </div>
</main>

<a href="#" class="go-up" id="goUp">go up</a>

<script src="script.js"></script>
</body>
</html>
